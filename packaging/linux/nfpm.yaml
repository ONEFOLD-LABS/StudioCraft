# deb und rpm aus dem vorbereiteten Verzeichnisbaum (packaging/linux/package.sh setzt ${STAGE}).
name: studiocraft
arch: ${NFPM_ARCH}
version: ${VERSION}
maintainer: StudioCraft contributors
description: Digital audio workstation – record, arrange and mix music
homepage: https://github.com/xXCrusaderXx/StudioCraft
license: MIT OR Apache-2.0
section: sound
priority: optional
# Alternativen mit "|" versteht nur deb; rpm bekommt eigene Namen. Ubuntu 24.04 und Debian 13
# haben die Bibliotheken als …t64 umbenannt.
# lilv lädt StudioCraft erst zur Laufzeit (LV2-Plugins); ohne lilv fehlt nur LV2.
overrides:
  deb:
    depends:
      - libasound2t64 | libasound2
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
    recommends:
      - liblilv-0-0
  rpm:
    depends:
      - alsa-lib
      - pipewire-libs
    recommends:
      - lilv-libs
contents:
  - src: ${STAGE}/usr/
    dst: /usr/
    type: tree
scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
