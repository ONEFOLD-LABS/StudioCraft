[package]
name = "studiocraft-plugin-host"
description = "Plugin-Hosting: CLAP, später VST3 und LV2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap-sys = "0.5"
libloading = "0.9"

[target.'cfg(all(unix, not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
x11rb = "0.13"

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"

[[test]]
name = "gui_main_thread"
harness = false
