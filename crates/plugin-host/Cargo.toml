[package]
name = "studiocraft-plugin-host"
description = "Plugin-Hosting: CLAP, später VST3 und LV2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap-sys = "0.5"
libloading = "0.9"

[target.'cfg(all(unix, not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
x11rb = "0.14"

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"

# Host-Fenster für eingebettete Plugin-Editoren (Issue #36); beide schon über winit im Baum.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSBundle",
    "NSGeometry",
    "NSString",
    "NSURL",
] }

[[test]]
name = "gui_main_thread"
harness = false

[[test]]
name = "latency_main_thread"
harness = false

[[test]]
name = "scan_child"
harness = false

[[test]]
name = "au_window_main_thread"
harness = false

[[test]]
name = "bridge_child"
harness = false

[lints]
workspace = true
