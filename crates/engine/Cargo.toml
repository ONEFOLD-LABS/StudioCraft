[package]
name = "studiocraft-engine"
description = "Audio-Engine: Transport, Audio-I/O, Echtzeit-Thread"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
studiocraft-project.workspace = true
studiocraft-plugin-host.workspace = true
hound = "3.5"
craft-audio.workspace = true
rtrb = "0.4"
# Instant, das auch im Browser läuft (dort hat std keine Uhr); sonst identisch mit std.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18"

# midir hat nur für diese Systeme ein Backend; sonst fehlt MIDI (src/midi_backend.rs).
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
midir = "0.11"

# Linux: PipeWire als bevorzugter Host (sonst ALSA). Die BSDs laufen über ALSA, das dort per
# alsa-plugins-oss auf OSS geht; PipeWire gibt es dort nur mit dem Feature `pipewire`.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire"] }

# Windows: eigener WASAPI-Pfad exklusiv und mit geringer Latenz (src/wasapi.rs). Dieselbe
# Version und Features wie bei cpal, damit nichts doppelt gebaut wird.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.18", features = ["wasm-bindgen"] }

[features]
default = []
# BSD: PipeWire zusätzlich zu ALSA (unter Linux immer dabei).
pipewire = ["cpal/pipewire"]
# Linux/BSD/macOS: JACK als zusätzlicher Host.
jack = ["cpal/jack"]
# Windows: ASIO-Treiber (braucht das ASIO-SDK beim Bauen).
asio = ["cpal/asio"]
