[package]
name = "studiocraft-ui"
description = "Oberfläche: Projektfenster, Mixer, Editoren (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
studiocraft-project.workspace = true
studiocraft-engine.workspace = true
studiocraft-plugin-host.workspace = true
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Umrisse der Notenschrift für den PDF-Export (schon über egui im Baum).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Instant, das auch im Browser läuft; sonst identisch mit std.
web-time = "1"
# Sprache des Systems (Einstellung „Wie das System“); im Browser über navigator.language.
sys-locale = "0.3"
# Projekt-Bündel (zip) für den Browser; nur Deflate über das reine Rust-Backend.
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }
# Backend für zip: reines Rust (miniz_oxide), läuft nativ und im Browser.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
# Gemeinsame Fensterrahmen-Regel der Craft-Apps (storytold/craft-libs, MIT OR Apache-2.0).
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "56c3c833bb869a140271e2aceec2112322cacc58", default-features = false, features = ["egui"] }

# AAF- und OMF-Projekte lesen (storytold/craft-libs, MIT OR Apache-2.0; reines Rust).
craft-aaf = { git = "https://github.com/storytold/craft-libs", rev = "56c3c833bb869a140271e2aceec2112322cacc58" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"

# Browser: Datei-Auswahl (rfd, asynchron) und Downloads (Blob-Link).
[target.'cfg(target_arch = "wasm32")'.dependencies]
sys-locale = { version = "0.3", features = ["js"] }
rfd = { version = "0.17", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
