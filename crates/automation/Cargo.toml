[package]
name = "studiocraft-automation"
description = "StudioCraft für KI-Agenten: MCP-Server (JSON-RPC über stdio), kopflos oder über den Steuerkanal der laufenden App"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
studiocraft-project.workspace = true
studiocraft-ui.workspace = true
serde_json = "1"
# Gleiche Revision wie craft-window in studiocraft-ui.
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "56c3c833bb869a140271e2aceec2112322cacc58" }
craft-control = { git = "https://github.com/storytold/craft-libs", rev = "56c3c833bb869a140271e2aceec2112322cacc58" }
# The app window for agents: screenshots (`ui_screenshot`), its widget tree (AccessKit, as the
# app builds it for screen readers) and clicks. Same egui as studiocraft-ui.
egui = { version = "0.37", default-features = false }
png = "0.18"

[dev-dependencies]
studiocraft-project.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
