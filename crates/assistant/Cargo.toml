[package]
name = "studiocraft-assistant"
description = "KI-Assistent im Projektfenster: Chat mit einem Sprachmodell, das das Projekt über die Agenten-Werkzeuge bearbeitet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
studiocraft-automation.workspace = true
studiocraft-ui.workspace = true
egui = { version = "0.37", default-features = false }
serde_json = "1"
# OpenAI-compatible chat completions over HTTPS. TLS by rustls with ring; the root certificates
# are the operating system's (rustls-native-certs), so no bundled root list is needed.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
studiocraft-project.workspace = true
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[lints]
workspace = true
