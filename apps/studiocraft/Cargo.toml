[package]
name = "studiocraft"
description = "StudioCraft – plattformübergreifende DAW"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
studiocraft-engine.workspace = true
studiocraft-project.workspace = true
studiocraft-ui.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
# Same winit as eframe: the app runs eframe on its own event loop to see where a key lies
# (numeric keypad, Issue #3).
winit = { version = "0.30", default-features = false }
