[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
studiocraft-assistant = { path = "crates/assistant" }
studiocraft-automation = { path = "crates/automation" }
studiocraft-engine = { path = "crates/engine" }
studiocraft-project = { path = "crates/project" }
studiocraft-plugin-host = { path = "crates/plugin-host" }
studiocraft-ui = { path = "crates/ui" }

# Gemeinsame Bibliotheken der Craft-Familie (gleiche Revision wie SoundCraft).
craft-audio = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "45a8e16669e70dadb780dfbc759c882dd5b7ea1c", features = ["decode", "lossless-encode"] }

[profile.release]
lto = "thin"
codegen-units = 1
