[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
studiocraft-assistant = { path = "crates/assistant" }
studiocraft-automation = { path = "crates/automation" }
studiocraft-engine = { path = "crates/engine" }
studiocraft-project = { path = "crates/project" }
studiocraft-plugin-host = { path = "crates/plugin-host" }
studiocraft-ui = { path = "crates/ui" }

# Bibliotheken aus storytold/craft-libs (MIT OR Apache-2.0), dieselbe Revision wie die
# übrigen craft-Crates.
craft-audio = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "56c3c833bb869a140271e2aceec2112322cacc58", features = ["decode", "lossless-encode"] }

[profile.release]
lto = "thin"
codegen-units = 1
