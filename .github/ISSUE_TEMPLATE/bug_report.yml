name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Create an audio track\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (studiocraft --version)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system, audio backend and device
      placeholder: "Arch Linux, PipeWire, USB Audio Interface"
  - type: textarea
    id: logs
    attributes:
      label: Terminal output or logs
      render: text
