name: CI

# Prüfungen für jeden Push auf main und jeden Pull Request (`cargo xtask ci`), über den
# Gate-Workflow aus storytold/craft-common-actions, auf einen festen Commit
# gepinnt: Änderungen dort kommen nur über einen eigenen Pull Request hier an.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@4ec2a14646b538253fd5ebe109bf463a3d31b061 # main 2026-11-20
    with:
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev libasound2-dev libpipewire-0.3-dev libclang-dev
      # Windows and macOS legs: on pull requests only when platform cfg code, its dependents or
      # the build setup change (or with the label full-ci); on pushes to main always. Only the
      # Linux leg is a required check.
      os: '["ubuntu-24.04","windows-latest","macos-latest"]'
      select-os: '["windows-latest","macos-latest"]'
      select-label: full-ci

  # The browser build (wasm32): clippy without warnings for the web app and everything it uses.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p studiocraft-web -- -D warnings
