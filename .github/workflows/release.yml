name: Release

# A tag v* builds packages for every platform and publishes them as a draft GitHub release.
# workflow_dispatch and the nightly schedule run the same builds without publishing, so a broken
# package shows up within a day, not on release day. (StudioCraft keeps its own release workflow
# instead of the shared Craft one, which assumes that family's branches and app ids; issue #31.)
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        # 24.04: libspa 0.10 (cpal's PipeWire backend) needs PipeWire headers newer than
        # the 0.3.48 that 22.04 ships.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm zsync desktop-file-utils appstream pkg-config flatpak flatpak-builder \
            libasound2-dev libpipewire-0.3-dev libclang-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev
      - run: packaging/linux/package.sh
      # Repackages the tarball above; installs it in the runner's user Flatpak as a smoke test.
      - run: packaging/linux/flatpak-bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: dist/release/*

  # riscv64: cross-compiled on x86_64 (tar.gz, deb, rpm); smoke test through qemu-user.
  linux-riscv64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: riscv64
      - uses: storytold/craft-common-actions/actions/install-riscv64-cross@main
      - name: More packages (PipeWire for riscv64, clang for bindgen, nfpm)
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nfpm clang libclang-dev libpipewire-0.3-dev:riscv64
      - name: Package
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_LIBDIR: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          BINDGEN_EXTRA_CLANG_ARGS_riscv64gc_unknown_linux_gnu: --target=riscv64-linux-gnu -I/usr/include/riscv64-linux-gnu
        run: packaging/linux/package.sh --target riscv64gc-unknown-linux-gnu --formats "tar deb rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-riscv64
          path: dist/release/*

  # Browser build: static site as a zip (trunk, wasm-bindgen and wasm-opt).
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: packaging/web/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/release/*

  # Arch Linux package from the x86_64 tarball (Arch's official images are x86_64 only).
  arch:
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-ubuntu-24.04
          path: dist/release
      - name: Build and install the package
        run: |
          pacman -Syu --noconfirm --needed base-devel git
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          # makepkg refuses to run as root.
          su builder -c "cd '$GITHUB_WORKSPACE' && CARGO_TARGET_DIR=/tmp/target DIST=/tmp/out packaging/linux/arch-package.sh dist/release/studiocraft-*-linux-x86_64.tar.gz"
          pacman -U --noconfirm /tmp/out/studiocraft-*.pkg.tar.zst
          studiocraft-cli --version
          studiocraft --version
          mkdir -p dist/arch && cp /tmp/out/studiocraft-*.pkg.tar.zst dist/arch/
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arch
          path: dist/arch/*

  # Install the deb and rpm on the distributions they target and start both programs.
  install-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            kind: deb
          - image: ubuntu:24.04
            kind: deb
          - image: fedora:latest
            kind: rpm
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-ubuntu-24.04
          path: pkgs
      - name: Install and start
        run: |
          if [ "${{ matrix.kind }}" = deb ]; then
            apt-get update
            apt-get install -y ./pkgs/studiocraft-*-linux-x86_64.deb
          else
            dnf install -y ./pkgs/studiocraft-*-linux-x86_64.rpm
          fi
          studiocraft-cli --version
          studiocraft --version
          test -f /usr/share/mime/packages/io.github.onefold_labs.studiocraft.xml

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          # Cross-compiled on x64; the smoke test is skipped there.
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/release/*

  macos:
    # Universal app (aarch64 + x86_64, the Intel half cross-compiled) on Apple silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-riscv64, arch, install-test, windows, macos, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "StudioCraft ${GITHUB_REF_NAME#v}"
